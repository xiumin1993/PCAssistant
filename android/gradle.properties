org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Disable Kotlin incremental compilation (fixes cross-drive cache issues)
kotlin.incremental=false
# Force Gradle build output to E drive to save C drive space
org.gradle.caching=true

# Use Android Studio bundled JBR (JDK 25): jlink in JDK 26 breaks AGP JdkImageTransform
org.gradle.java.home=E:/Android/Android Studio/jbr
